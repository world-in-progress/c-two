[project]
name = "c-two-workspace"
version = "0.0.0"
description = "Workspace root for C-Two."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "c-two",
]

[dependency-groups]
ci-policy = [
    "markdown-it-py>=4.0.0",
    "maturin>=1.7,<2.0",
    "packaging>=24.0",
    "pyyaml>=6.0.2",
    "pytest>=8.0.0",
    "pytest-timeout>=2.0.0",
    "pytest-xdist==3.8.0",
]
dev = [
    { include-group = "ci-policy" },
    "c-two[fastdb]",
    "httpx>=0.28.1",
    "numpy>=2.2.4",
    "pandas>=2.2.0",
]
banner = [
    "pillow>=13.0.0",
]
examples = [
    "numpy>=2.2.4",
    "pandas>=2.2.0",
]
benchmark = [
    "numpy>=2.2.4",
    # Ray does not currently publish a macOS aarch64 CPython 3.14t wheel.
    "ray>=2.55.0; python_version < '3.14'",
]

[tool.uv]
package = false
constraint-dependencies = ["filelock>=4.2.1"]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "sdk/python/pyproject.toml" },
    { file = "sdk/python/native/Cargo.toml" },
    { file = "sdk/python/native/Cargo.lock" },
    { file = "sdk/python/native/**/*.rs" },
    { file = "core/**/*.rs" },
    { file = "core/**/Cargo.toml" },
]

[tool.uv.sources]
c-two = { workspace = true }

[tool.uv.dependency-groups]
banner = { requires-python = ">=3.11" }
benchmark = { requires-python = ">=3.11" }

[tool.uv.workspace]
members = ["sdk/python"]

[tool.pytest.ini_options]
testpaths = ["sdk/python/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
timeout = 30
