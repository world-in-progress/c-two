[package]
name = "c2-cli"
version = "0.6.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/world-in-progress/c-two"
description = "Cross-language command-line interface for C-Two"

[[bin]]
name = "c3"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
c2-config = { version = "0.1.0", path = "../core/foundation/c2-config" }
c2-codegen = { version = "0.1.0", path = "../core/foundation/c2-codegen" }
c2-contract = { version = "0.1.0", path = "../core/foundation/c2-contract" }
c2-core = { version = "0.1.0", path = "../core/runtime/c2-core" }
c2-http = { version = "0.1.0", path = "../core/transport/c2-http", features = ["relay"] }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

# `endpoint reap` opens a credential file without ever blocking on a FIFO.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Deployable c3 builds statically link the FastDB payload Core from the official
# FastDB repository checkout instead of requiring a system-installed libfastdb.
# The safe fastdb crate itself still comes from crates.io; this patch reroutes
# only the raw fastdb-sys bindings to the immutable v0.2.4 source at this rev,
# whose checkout layout lets its build script drive source-mode CMake builds.
[patch.crates-io]
fastdb-sys = { git = "https://github.com/world-in-progress/fastdb", rev = "f82fa13adeae2b87a295bf984821c85c44b55a3d" }
