[package]
name = "c2-wire"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Wire protocol codec for C-Two IPC frames"

[dependencies]
c2-config = { version = "0.1.0", path = "../../foundation/c2-config" }
c2-contract = { version = "0.1.0", path = "../../foundation/c2-contract" }
c2-error = { version = "0.1.0", path = "../../foundation/c2-error" }
c2-mem = { version = "0.1.0", path = "../../foundation/c2-mem" }
parking_lot = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
