[package]
name = "c2-contract"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Contract identity validation and hashing for C-Two routes"

[dependencies]
serde = "1"
serde_json = { version = "1", features = ["unbounded_depth"] }
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
# Exercise canonicalization with insertion-ordered JSON maps so tests cannot
# accidentally rely on serde_json's default sorted-map implementation.
serde_json = { version = "1", features = ["preserve_order"] }
