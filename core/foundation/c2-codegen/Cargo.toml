[package]
name = "c2-codegen"
edition.workspace = true
version.workspace = true
description = "Language-neutral SDK code generation for C-Two contracts"

[dependencies]
c2-contract = { path = "../c2-contract" }
fastdb = { path = "../../../../fastdb/bindings/rust/fastdb" }
rustix = { version = "1", features = ["fs"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
