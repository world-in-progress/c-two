[package]
name = "c2-mem-ffi"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "C ABI for C-Two native client adapters"

[lib]
name = "c2_mem_ffi"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
c2-config = { version = "0.1.0", path = "../c2-config" }
c2-core = { version = "0.1.0", path = "../../runtime/c2-core" }
c2-contract = { version = "0.1.0", path = "../c2-contract" }
c2-error = { version = "0.1.0", path = "../c2-error" }
c2-ipc = { version = "0.1.0", path = "../../transport/c2-ipc" }
serde_json = "1"
futures-util = "0.3"
parking_lot.workspace = true

[target.'cfg(any(unix, windows))'.dependencies]
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
