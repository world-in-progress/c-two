[package]
name = "c2-config"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared configuration types for C-Two IPC transport, memory pool, and relay"

[lib]
name = "c2_config"

[dependencies]
dotenvy = "0.15"
gethostname = "1.1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
c2-local-security = { version = "0.1.0", path = "../c2-local-security" }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
