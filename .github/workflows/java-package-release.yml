name: Java Package Release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Release Candidate run ID on canonical main
        required: true
        type: string
      deployment_id:
        description: Central Portal deployment UUID to resume
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-publication
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'world-in-progress/c-two' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      action: ${{ steps.prepare.outputs.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet packaging
      - name: Verify and stage the retained Maven files
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          set -euo pipefail
          python .github/scripts/promote_release_candidate.py prepare \
            --target maven-central --candidate-run-id "$CANDIDATE_RUN_ID" \
            --deployment-id "$DEPLOYMENT_ID" --summary-output "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads(Path("promotion-plan.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"action={plan['maven_central']['action']}", file=output)
          PY
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.action == 'upload' || inputs.deployment_id != ''
        with:
          name: promotion-staging
          path: candidate-download/staging/maven/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: promotion-plan
          path: promotion-plan.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    if: >-
      github.repository == 'world-in-progress/c-two' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      (needs.prepare.outputs.action == 'upload' || inputs.deployment_id != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: promotion-staging
          path: staging/maven
      - uses: actions/download-artifact@v4
        with:
          name: promotion-plan
          path: .
      - name: Refuse blind re-run of publish after attempt 1
        if: github.run_attempt != '1' && inputs.deployment_id == ''
        run: |
          echo "error: refusing to re-run publish without deployment_id; recover the UUID from maven-deployment-state/deployment.json (or Central Portal) and dispatch a new run with deployment_id" >&2
          exit 1
      - name: Sign and publish the verified Maven files
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          python .github/scripts/maven_publish.py --staging-dir staging/maven \
            --plan promotion-plan.json --work-dir maven-deployment \
            --deployment-id "$DEPLOYMENT_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maven-deployment-state
          path: |
            maven-deployment/deployment.json
            maven-deployment/maven-publication-receipt.json
          if-no-files-found: ignore
          retention-days: 30
