name: CLI Release

# Exact-tested-candidate promotion (step 2 of the release plan). This workflow
# never rebuilds: it promotes the byte-exact c3 binaries, canonical installer
# assets, and FastDB license evidence retained by the Release Candidate
# workflow, and only after BOTH same-source main-push gates succeeded — the
# Release Candidate run itself and the Windows Native full-scope runs on
# windows-2022 and windows-2025. Whichever gate completes first defers; the
# late completion re-triggers promotion. All provenance is resolved through
# the authenticated GitHub API before any publish authority is used, and the
# publishing job only ever uploads the verified, staged bytes.
# The prepare job checks out the current main workflow code (never the
# candidate SHA) and must run on refs/heads/main of the canonical repository;
# dry_run performs the identical read-only verification without publishing.
# Automatic workflow_run promotions whose c3 version is already fully
# released finish as an explicit no-publication skip: the published release
# must be complete with digest-carrying assets and bound to the tagged
# source commit through its retained rc-manifest.json (no tag move, no
# asset writes); manual dispatches keep failing closed on that collision.

on:
  workflow_run:
    workflows: [Release Candidate, Windows Native]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Release Candidate run id to promote (or leave empty with source_sha)"
        default: ""
        type: string
      source_sha:
        description: "Candidate source SHA from a canonical main push (or leave empty with candidate_run_id)"
        default: ""
        type: string
      dry_run:
        description: "Prepare and verify the promotion without publishing"
        default: false
        type: boolean

permissions:
  contents: read

# Promotions must not race each other: the second run re-checks remote state
# and skips only byte-identical assets.
concurrency:
  group: cli-release-promotion
  cancel-in-progress: false

jobs:
  prepare:
    name: verify tested candidate
    # Fail closed outside the canonical repository/main ref and for
    # pull_request candidate runs: fork PR artifacts and off-main dispatches
    # must never reach publish authority.
    if: >-
      github.repository == 'world-in-progress/c-two' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      deferred: ${{ steps.prepare.outputs.deferred }}
      action: ${{ steps.prepare.outputs.action }}
      tag: ${{ steps.prepare.outputs.tag }}
      title: ${{ steps.prepare.outputs.title }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      release_exists: ${{ steps.prepare.outputs.release_exists }}
      tag_exists: ${{ steps.prepare.outputs.tag_exists }}
    steps:
      # The default checkout is the current main code: the promotion trusts
      # the reviewed validators on main, never the candidate's input SHA.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install packaging
        run: python -m pip install --quiet packaging

      - name: Verify the tested candidate and stage release bytes
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || inputs.source_sha }}
          CANDIDATE_RUN_ID: ${{ (github.event.workflow_run.name == 'Release Candidate' && github.event.workflow_run.id) || inputs.candidate_run_id }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          AUTOMATIC: ${{ github.event_name == 'workflow_run' }}
        run: |
          set -euo pipefail
          args=(
            --target github-release
            --download-dir candidate-download
            --plan-output promotion-plan.json
            --release-body-output release-body.md
          )
          if [ -n "$SOURCE_SHA" ]; then args+=(--source-sha "$SOURCE_SHA"); fi
          if [ -n "$CANDIDATE_RUN_ID" ]; then args+=(--candidate-run-id "$CANDIDATE_RUN_ID"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          # Only the automatic workflow_run path may finish as an explicit
          # already-published skip; manual dispatches stay fail-closed.
          if [ "$AUTOMATIC" = "true" ]; then args+=(--skip-already-published); fi
          code=0
          python .github/scripts/promote_release_candidate.py prepare "${args[@]}" || code=$?
          if [ "$code" -eq 75 ]; then
            {
              echo "deferred=true"
              echo "action=deferred"
            } >> "$GITHUB_OUTPUT"
            echo "Deferring: the other same-source gate is still running; its completion re-triggers promotion."
            exit 0
          fi
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          python - <<'PY'
          import json, os, pathlib
          plan = json.loads(pathlib.Path("promotion-plan.json").read_text(encoding="utf-8"))
          release = plan.get("github_release") or plan["skip"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("deferred=false\n")
              output.write(f"action={release['action']}\n")
              output.write(f"tag={release['tag']}\n")
              output.write(f"title={release['title']}\n")
              output.write(f"source_sha={plan['source_sha']}\n")
              output.write(f"release_exists={str(release['release_exists']).lower()}\n")
              output.write(f"tag_exists={str(release['tag_exists']).lower()}\n")
          if release["action"] == "skip-already-published":
              # Early skips live under plan["skip"]; a late race skip is
              # classified inside github_release — read the selected group's
              # own reason either way.
              print(f"No publication: {release['reason']}")
          PY

      # The upload's least-common ancestor is the staging directory itself, so
      # the artifact members are <name>; downloading into ./staging
      # restores the exact plan staged_path layout. An already-published skip
      # retains nothing: it decided before staging any bytes.
      - name: Retain the staged, verified release bytes
        if: steps.prepare.outputs.deferred != 'true' && steps.prepare.outputs.action != 'skip-already-published'
        uses: actions/upload-artifact@v4
        with:
          name: promotion-staging
          path: candidate-download/staging

      - name: Retain the promotion plan and release body
        if: steps.prepare.outputs.deferred != 'true' && steps.prepare.outputs.action != 'skip-already-published'
        uses: actions/upload-artifact@v4
        with:
          name: promotion-plan
          path: |
            promotion-plan.json
            release-body.md

  publish:
    name: publish verified candidate
    needs: prepare
    if: >-
      needs.prepare.outputs.deferred == 'false' &&
      needs.prepare.outputs.action == 'upload' &&
      inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      REPO: world-in-progress/c-two
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: promotion-staging
          path: staging

      - uses: actions/download-artifact@v4
        with:
          name: promotion-plan
          path: .

      - name: Recheck staged bytes before publication
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          plan = json.loads(pathlib.Path("promotion-plan.json").read_text())
          group = plan.get("github_release") or plan["pypi"]
          entries = group.get("assets", group.get("files", []))
          root = pathlib.Path("staging").resolve()
          selected = set()
          for entry in entries:
              if entry["disposition"] != "upload":
                  continue
              path = pathlib.Path(entry["staged_path"]).resolve()
              assert path.is_relative_to(root) and path.is_file(), path
              assert path.stat().st_size == entry["bytes"], path
              assert hashlib.sha256(path.read_bytes()).hexdigest() == entry["sha256"], path
              selected.add(path)
          assert selected, "nothing verified for publication"
          if "pypi" in plan:
              assert selected == {p.resolve() for p in (root / "dist").rglob("*") if p.is_file()}
          PY

      # Create only when the verified plan says the release is missing; a
      # partial existing release is completed, never recreated. An existing
      # tag (already proven to point at the candidate source) is guarded with
      # --verify-tag; a missing one is created at the candidate source SHA.
      - name: Create the release when the plan says it is missing
        if: needs.prepare.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TITLE: ${{ needs.prepare.outputs.title }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          TAG_EXISTS: ${{ needs.prepare.outputs.tag_exists }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$TAG_EXISTS" = "true" ]; then
            extra+=(--verify-tag)
          else
            extra+=(--target "$SOURCE_SHA")
          fi
          gh release create "$TAG" --repo "$REPO" --title "$TITLE" \
            --notes-file release-body.md "${extra[@]}"

      # No --clobber anywhere: the upload list holds only plan-verified
      # missing assets, and gh release upload fails if a name already exists.
      - name: Upload the verified candidate bytes as release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          python - <<'PY' > upload-files.txt
          import json, pathlib
          plan = json.loads(pathlib.Path("promotion-plan.json").read_text(encoding="utf-8"))
          for asset in plan["github_release"]["assets"]:
              if asset["disposition"] == "upload":
                  print(asset["staged_path"])
          PY
          test -s upload-files.txt
          xargs gh release upload "$TAG" --repo "$REPO" < upload-files.txt
