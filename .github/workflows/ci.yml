name: Source Validation

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  FASTDB_SOURCE_SHA: 4f99f86a662b0e950a0dd29800c25a1c9fca4def
  EMSDK_SOURCE_SHA: c817c0ca4ba889ee24a185fd954cff7de1bd8afa
  EMSDK_VERSION: "5.0.2"
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  # Keep file/line backtraces without full variable/type debug information.
  # Whole shared targets must fit alongside the RC and compiler caches.
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IDLE_TIMEOUT: "0"
  PYTHONUTF8: "1"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.filter.outputs.source }}
    steps:
      # PR paths come from the API, without checking out a second copy.
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            source:
              - 'core/**'
              - 'cli/**'
              - 'sdk/**'
              - 'examples/**'
              - 'tools/**'
              - 'tests/**'
              - '.github/**'
              - '.gitattributes'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'rust-toolchain*'

  source:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.source == 'true'
    name: source (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.12', scope: full}
          - {os: macos-15, python: '3.12', scope: full}
          - {os: windows-2022, python: '3.12', scope: full}
          - {os: windows-2025, python: '3.12', scope: full}
          - {os: ubuntu-24.04, python: '3.14t', scope: python}
    defaults:
      run:
        working-directory: c-two
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: c-two
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: world-in-progress/fastdb
          ref: ${{ env.FASTDB_SOURCE_SHA }}
          path: fastdb
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          check-latest: true
          cache: npm
          cache-dependency-path: |
            fastdb/ts/fastdb4ts/package-lock.json
            c-two/core/foundation/c2-mem-ffi/bindings/typescript/package-lock.json
      - name: Set up Go for relay benchmark tool
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: false
      - name: Install relay benchmark prerequisite
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/c2-hey
        run: |
          go install github.com/rakyll/hey@v0.1.4
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Prepare official FastDB CoreSDK
        id: fastdb_sdk
        run: python .github/scripts/prepare_fastdb_sdk.py --output "${{ runner.temp }}/fastdb-core-sdk"
      - name: Identify the shared Cargo toolchain
        id: cargo_identity
        shell: bash
        run: |
          python - <<'PYTHON'
          import hashlib, os, subprocess
          compiler = "cl" if os.name == "nt" else "cc"
          identity = subprocess.check_output(["rustc", "-vV"])
          identity += subprocess.run([compiler, "--version"] if compiler != "cl" else [compiler],
                                     stdout=subprocess.PIPE, stderr=subprocess.STDOUT).stdout
          inputs = {key: value for key, value in os.environ.items()
                    if key.startswith(("CARGO", "RUST", "CC", "CXX", "CFLAGS", "CMAKE", "MACOSX", "VCTools"))}
          identity += repr(sorted(inputs.items())).encode()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print("key=" + hashlib.sha256(identity).hexdigest()[:24], file=output)
          PYTHON
      # All five Cargo workspaces write this target. A workspace-aware pruner
      # would delete the other workspaces' dependencies; Cargo fingerprints
      # validate the complete restored tree before every build/test command.
      - uses: actions/cache/restore@v4
        id: cargo_cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
            c-two/core/target
          key: source-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-${{ matrix.python }}-${{ steps.cargo_identity.outputs.key }}-${{ hashFiles('c-two/**/Cargo.lock', 'c-two/**/Cargo.toml', 'c-two/**/.cargo/config.toml', 'c-two/**/rust-toolchain*', 'fastdb/bindings/rust/Cargo.lock', 'fastdb/bindings/rust/**/Cargo.toml', 'c-two/.github/workflows/ci.yml', 'c-two/tools/ci/source_validation.py') }}-${{ env.FASTDB_SOURCE_SHA }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Cache the pinned Emscripten SDK
        id: emsdk_cache
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ runner.os }}-${{ runner.arch }}-${{ env.EMSDK_SOURCE_SHA }}-${{ env.EMSDK_VERSION }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.emsdk_cache.outputs.cache-hit != 'true'
        with:
          repository: emscripten-core/emsdk
          ref: ${{ env.EMSDK_SOURCE_SHA }}
          path: emsdk
          persist-credentials: false
      - name: Activate Emscripten on Unix
        if: runner.os != 'Windows'
        shell: bash
        working-directory: emsdk
        run: |
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"
          source ./emsdk_env.sh
          for name in EMSDK EMSDK_NODE EMSDK_PYTHON EM_CONFIG; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then echo "$name=$value" >> "$GITHUB_ENV"; fi
          done
          echo "$PWD" >> "$GITHUB_PATH"
          echo "$PWD/upstream/emscripten" >> "$GITHUB_PATH"
      - name: Activate Emscripten on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: emsdk
        run: |
          $gitBash = Join-Path $env:ProgramFiles "Git/bin/bash.exe"
          if (-not (Test-Path $gitBash -PathType Leaf)) { throw "Git Bash is required" }
          "C2_FASTDB_NPM_SCRIPT_SHELL=$gitBash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & .\emsdk.ps1 install $env:EMSDK_VERSION
          if ($LASTEXITCODE -ne 0) { throw "emsdk install failed" }
          & .\emsdk.ps1 activate $env:EMSDK_VERSION
          if ($LASTEXITCODE -ne 0) { throw "emsdk activate failed" }
          & .\emsdk_env.ps1
          if ($LASTEXITCODE -ne 0) { throw "emsdk environment failed" }
          foreach ($name in @("EMSDK", "EMSDK_NODE", "EMSDK_PYTHON", "EM_CONFIG")) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          (Get-Location).Path | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Join-Path (Get-Location).Path "upstream/emscripten") | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Cache the pinned FastDB WASM prerequisite
        uses: actions/cache@v4
        with:
          path: fastdb-wasm
          key: source-fastdb-wasm-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.FASTDB_SOURCE_SHA }}-${{ env.EMSDK_SOURCE_SHA }}-${{ env.EMSDK_VERSION }}
      - name: Run shared source validation
        env:
          C2_WORKFLOW_SHA: ${{ github.workflow_sha }}
          C2_RUNNER_LABEL: ${{ matrix.os }}
          RUSTC_WRAPPER: sccache
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: >-
          python tools/ci/source_validation.py
          --expected-c-two-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --expected-fastdb-sha "${{ env.FASTDB_SOURCE_SHA }}"
          --fastdb-system-lib-dir "${{ steps.fastdb_sdk.outputs.lib-dir }}"
          --scope "${{ matrix.scope }}"
          --output "artifacts/source"
      - name: Save shared Cargo outputs, including after test failures
        if: always() && !cancelled() && steps.cargo_cache.outputs.cache-hit != 'true' && steps.cargo_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
            c-two/core/target
          key: ${{ steps.cargo_cache.outputs.cache-primary-key }}
      - name: Retain compiler cache statistics
        if: always()
        shell: bash
        run: |
          source .github/scripts/compiler_cache.sh
          c2_write_compiler_cache_stats artifacts/source/compiler-cache
      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.scope }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            c-two/artifacts/source/
            !c-two/artifacts/source/python-suite/ordinary/tmp/**
            !c-two/artifacts/source/python-suite/portable/tmp/**
            !c-two/artifacts/source/python-suite/typescript/tmp/**
          if-no-files-found: error
          retention-days: 14

  required:
    needs: [changes, source, workflow-policy]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14t']
    # Preserve protected-branch check names; both now require every platform.
    name: test (py${{ matrix.python }})
    steps:
      - name: Require every applicable source check
        env:
          CHANGES: ${{ needs.changes.result }}
          SOURCE: ${{ needs.source.result }}
          POLICY: ${{ needs.workflow-policy.result }}
          REQUIRED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.source == 'true' }}
        run: |
          test "$CHANGES" = success
          if [ "$REQUIRED" = true ]; then
            test "$SOURCE" = success
            test "$POLICY" = success
          else
            test "$SOURCE" = skipped
            test "$POLICY" = skipped
          fi
  workflow-policy:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    name: workflow policy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Run workflow policy tests
        run: >-
          uv run --no-project
          --with pytest
          --with pytest-timeout
          --with packaging
          --with pyyaml
          --with maturin
          pytest
          --confcutdir=tests/repo
          tests/repo/test_cli_release_workflow.py
          tests/repo/test_python_package_release_workflow.py
          tests/repo/test_c3_tool.py
          tests/repo/test_c3_installer.py
          tests/repo/test_install_c3_powershell.py
          tests/repo/test_prepare_fastdb_sdk.py
          tests/repo/test_release_candidate.py
          tests/repo/test_compiler_cache.py
          tests/repo/test_resolve_fastdb_release.py
          tests/repo/test_release_candidate_promotion.py
          tests/repo/test_source_validation.py
          tests/repo/test_ipc_memory_benchmark.py
          -q --timeout=30
