name: Python Package Release
run-name: Python Package Release · candidate ${{ inputs.candidate_run_id }}

# Promotion never builds. Select one verified, immutable candidate explicitly.
# Ordinary pushes and completed validation runs cannot publish a release.
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Successful Release Candidate run on canonical main"
        required: true
        type: string

permissions:
  contents: read

# Promotions must not race each other: the second run re-checks the registry
# and skips only byte-identical files.
concurrency:
  group: python-package-release-promotion
  cancel-in-progress: false

jobs:
  prepare:
    name: verify tested candidate
    # Fail closed outside the canonical repository/main ref and for
    # pull_request candidate runs: fork PR artifacts and off-main dispatches
    # must never reach publish authority.
    if: >-
      github.repository == 'world-in-progress/c-two' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      action: ${{ steps.prepare.outputs.action }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
    steps:
      # The default checkout is the current main code: the promotion trusts
      # the reviewed validators on main, never the candidate's input SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install packaging
        run: python -m pip install --quiet packaging

      - name: Verify the tested candidate and stage distribution files
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          args=(
            --target pypi
            --download-dir candidate-download
            --plan-output promotion-plan.json
          )
          args+=(--candidate-run-id "$CANDIDATE_RUN_ID")
          python .github/scripts/promote_release_candidate.py prepare "${args[@]}" --summary-output "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json, os, pathlib
          plan = json.loads(pathlib.Path("promotion-plan.json").read_text(encoding="utf-8"))
          group = plan["pypi"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"action={group['action']}\n")
              output.write(f"source_sha={plan['source_sha']}\n")
          PY

      # The upload's least-common ancestor is the staging directory itself, so
      # the artifact members are dist/<name> under the staging root;
      # downloading into ./staging restores the plan's staging/dist layout.
      - name: Retain the staged, verified distribution files
        uses: actions/upload-artifact@v4
        with:
          name: promotion-staging
          path: candidate-download/staging
          retention-days: 7

      - name: Retain the promotion plan
        uses: actions/upload-artifact@v4
        with:
          name: promotion-plan
          path: promotion-plan.json
          retention-days: 7

  publish:
    name: publish verified candidate
    needs: prepare
    if: >-
      needs.prepare.outputs.action == 'upload'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: promotion-staging
          path: staging

      - uses: actions/download-artifact@v4
        with:
          name: promotion-plan
          path: .

      - name: Recheck staged bytes before publication
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          plan = json.loads(pathlib.Path("promotion-plan.json").read_text())
          group = plan.get("github_release") or plan["pypi"]
          entries = group.get("assets", group.get("files", []))
          root = pathlib.Path("staging").resolve()
          selected = set()
          for entry in entries:
              if entry["disposition"] != "upload":
                  continue
              path = pathlib.Path(entry["staged_path"]).resolve()
              assert path.is_relative_to(root) and path.is_file(), path
              assert path.stat().st_size == entry["bytes"], path
              assert hashlib.sha256(path.read_bytes()).hexdigest() == entry["sha256"], path
              selected.add(path)
          assert selected, "nothing verified for publication"
          if "pypi" in plan:
              assert selected == {p.resolve() for p in (root / "dist").rglob("*") if p.is_file()}
          PY

      # The staged directory holds exactly the registry-missing files (the
      # prepare job proved every already-published file byte-identical and
      # removed those copies), so no skip-existing escape hatch is used: an
      # unexpected registry collision must fail loudly instead of being
      # silently accepted.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: staging/dist
          verbose: true
