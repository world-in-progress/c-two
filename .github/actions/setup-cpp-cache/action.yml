name: Prepare Unix C++ compiler cache
description: Configure CMake compiler launchers and a GitHub-backed sccache daemon
runs:
  using: composite
  steps:
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.16.0
    - name: Configure C/C++ compiler launchers
      shell: bash
      run: |
        set -euo pipefail
        source .github/scripts/compiler_cache.sh
        c2_enable_cpp_cache
        {
          echo 'CMAKE_C_COMPILER_LAUNCHER=sccache'
          echo 'CMAKE_CXX_COMPILER_LAUNCHER=sccache'
          echo 'SCCACHE_IDLE_TIMEOUT=0'
          echo 'SCCACHE_GHA_ENABLED=true'
        } >> "$GITHUB_ENV"
